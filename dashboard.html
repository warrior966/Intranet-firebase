<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: #f8fafc; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="toast-container"></div>

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <h2 class="text-xl font-black text-blue-600 tracking-tighter italic uppercase">Intranet 2.0</h2>
        <div class="flex items-center gap-4 text-sm font-medium">
            <span id="user-name" class="text-slate-600 bg-slate-100 px-3 py-1 rounded-full text-xs font-bold">Cargando...</span>
            <button id="btnLogout" class="text-red-500 hover:text-red-700 transition font-bold uppercase text-[10px]">Cerrar Sesión</button>
        </div>
    </header>

    <nav class="flex justify-center bg-white border-b sticky top-14 z-10 overflow-x-auto">
        <button onclick="showTab('inicio')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest nav-active">Inicio</button>
        <button onclick="showTab('enlaces')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Enlaces</button>
        <button onclick="showTab('chat')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Chat Grupal</button>
        <button onclick="showTab('cuenta')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Mi Cuenta</button>
        <button id="admin-tab" onclick="showTab('admin')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest hidden text-purple-600">Admin</button>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        
        <section id="inicio" class="tab-content active-tab space-y-6">
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-8 rounded-[2rem] text-white shadow-2xl">
                <h3 id="welcome-text" class="text-3xl font-black mb-2">...</h3>
                <p id="current-date" class="text-[10px] font-bold text-blue-400 uppercase tracking-[0.2em]"></p>
            </div>

            <div id="announcement-container" class="hidden">
                <div class="bg-amber-50 border border-amber-100 p-6 rounded-[2rem] shadow-sm relative overflow-hidden">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2 h-2 bg-amber-500 rounded-full animate-ping"></span>
                        <h4 id="announcement-title" class="font-black text-amber-800 uppercase text-[10px] tracking-widest"></h4>
                    </div>
                    <p id="announcement-body" class="text-amber-900 text-sm font-medium"></p>
                </div>
            </div>
        </section>
        
        <section id="enlaces" class="tab-content space-y-6">
            <h3 class="text-2xl font-black text-slate-800 uppercase italic">Recursos</h3>
            <div class="bg-blue-600 p-6 rounded-[2rem] shadow-lg space-y-4">
                <p class="text-white text-xs font-bold uppercase tracking-widest">Compartir enlace:</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="link-title" class="px-4 py-3 border-none rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="Nombre">
                    <input type="url" id="link-url" class="px-4 py-3 border-none rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="https://...">
                    <button id="btnSaveLink" class="bg-white text-blue-600 px-6 py-3 rounded-2xl font-black text-xs uppercase hover:bg-slate-100 transition">Añadir</button>
                </div>
            </div>
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 font-bold"></div>
        </section>

        <section id="chat" class="tab-content space-y-4">
            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[65vh] max-w-2xl mx-auto">
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50"></div>
                <div class="p-4 bg-white border-t flex gap-2">
                    <input type="text" id="chat-input" placeholder="Escribe al grupo..." class="flex-1 px-4 py-3 border rounded-2xl outline-none bg-slate-100 text-sm font-bold">
                    <button id="btnSend" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase">Enviar</button>
                </div>
            </div>
        </section>

        <section id="cuenta" class="tab-content space-y-6 max-w-xl mx-auto">
            <h3 class="text-2xl font-black text-slate-800 uppercase italic">Mi Perfil</h3>
            <div class="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-100 space-y-6">
                <div class="space-y-2 text-xs font-black uppercase tracking-widest text-slate-400">
                    <label>Nombre Público</label>
                    <div class="flex gap-2">
                        <input type="text" id="display-name-input" class="flex-1 px-4 py-3 border rounded-2xl bg-slate-50 outline-none" placeholder="Nombre">
                        <button id="btnUpdateProfile" class="bg-blue-600 text-white px-5 py-2 rounded-2xl font-black text-[10px]">Actualizar</button>
                    </div>
                </div>
                <div class="space-y-2 text-xs font-black uppercase tracking-widest text-slate-400 pt-4 border-t">
                    <label>Nueva contraseña</label>
                    <input type="password" id="new-password-input" class="w-full px-4 py-3 border rounded-2xl bg-slate-50 outline-none mb-2" placeholder="••••••">
                    <button id="btnUpdatePass" class="w-full bg-slate-800 text-white py-3 rounded-2xl font-black text-xs">Guardar Clave</button>
                </div>
            </div>
        </section>

        <section id="admin" class="tab-content space-y-6">
            <h3 class="text-2xl font-black text-purple-700 uppercase italic">Panel Admin</h3>
            <div class="grid grid-cols-1 gap-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-purple-100 space-y-4">
                        <h4 class="font-black text-slate-800 text-[10px] uppercase tracking-widest">📢 Anuncio Global</h4>
                        <input type="text" id="admin-ann-title" class="w-full px-4 py-2 border rounded-xl outline-none" placeholder="Título">
                        <textarea id="admin-ann-body" rows="2" class="w-full px-4 py-2 border rounded-xl outline-none text-sm" placeholder="Mensaje..."></textarea>
                        <div class="flex gap-2">
                            <button id="btnSaveAnn" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-black text-[10px] uppercase">Publicar</button>
                            <button id="btnDeleteAnn" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase">Quitar</button>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-purple-100">
                        <h4 class="font-black text-slate-800 text-[10px] uppercase mb-4 tracking-widest text-purple-600">👤 Usuarios</h4>
                        <div class="flex gap-2 mb-4">
                            <input type="email" id="new-user-email" class="flex-1 px-3 py-2 border rounded-xl outline-none text-sm font-bold" placeholder="email@empresa.com">
                            <button id="btnAddUser" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Añadir</button>
                        </div>
                        <ul id="user-list" class="divide-y max-h-40 overflow-y-auto"></ul>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-purple-100 space-y-4">
                    <h4 class="font-black text-slate-800 text-[10px] uppercase tracking-widest text-purple-600">🗑 Gestión de Contenidos</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <p class="text-[9px] font-black uppercase text-slate-400 mb-3">Eliminar Enlaces</p>
                            <ul id="admin-links-list" class="divide-y space-y-2 max-h-60 overflow-y-auto"></ul>
                        </div>
                        <div class="flex flex-col justify-center">
                            <button onclick="clearChat()" class="w-full bg-red-100 text-red-600 font-black py-4 text-xs uppercase rounded-2xl hover:bg-red-200 transition">Borrar Chat Grupal</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJd8syrMPQunEfBTH0sf9Khj_mSTkWeto",
            authDomain: "intranet-ba388.firebaseapp.com",
            projectId: "intranet-ba388",
            storageBucket: "intranet-ba388.firebasestorage.app",
            messagingSenderId: "104208696906",
            appId: "1:104208696906:web:1dc5ddf05d28d3eb89c8b3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const adminEmails = ["alvaro.guerreromaldonado@alumno.fomento.edu", "u6282143640@gmail.com"]; // CAMBIA ESTO

        const showToast = (msg, type = "success") => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast mb-2 px-6 py-3 rounded-2xl shadow-lg text-white font-bold text-xs uppercase tracking-widest ${type === 'success' ? 'bg-blue-600' : 'bg-red-500'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('nav-active'));
            const target = document.getElementById(tabId);
            if(target) target.classList.add('active-tab');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('onclick').includes(`'${tabId}'`)) btn.classList.add('nav-active');
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                document.getElementById('user-name').innerText = name;
                document.getElementById('display-name-input').value = user.displayName || "";
                document.getElementById('welcome-text').innerText = `HOLA, ${name.toUpperCase()}`;
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                if (adminEmails.includes(user.email)) document.getElementById('admin-tab').classList.remove('hidden');
            } else { window.location.href = "index.html"; }
        });

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // --- ANUNCIOS ---
        onSnapshot(doc(db, "configuracion", "anuncio"), (doc) => {
            const container = document.getElementById('announcement-container');
            if (doc.exists()) {
                container.classList.remove('hidden');
                document.getElementById('announcement-title').innerText = doc.data().titulo;
                document.getElementById('announcement-body').innerText = doc.data().mensaje;
            } else { container.classList.add('hidden'); }
        });

        // --- CHAT GRUPAL ---
        const chatRef = collection(db, "chat");
        document.getElementById('btnSend').onclick = async () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim()) {
                await addDoc(chatRef, { text: input.value, user: auth.currentUser.displayName || auth.currentUser.email.split('@')[0], timestamp: serverTimestamp() });
                input.value = "";
            }
        };
        onSnapshot(query(chatRef, orderBy("timestamp", "asc")), (snap) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = snap.docs.map(d => `
                <div class="flex flex-col ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'items-end' : 'items-start'}">
                    <div class="max-w-[85%] ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl' : 'bg-white text-slate-800 rounded-r-2xl rounded-tl-2xl border'} p-3 shadow-sm">
                        <p class="text-[8px] font-black opacity-50 uppercase mb-1">${d.data().user}</p>
                        <p class="text-sm font-bold tracking-tight">${d.data().text}</p>
                    </div>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        });

        // --- ENLACES ---
        const linksRef = collection(db, "enlaces");
        document.getElementById('btnSaveLink').onclick = async () => {
            const t = document.getElementById('link-title'), u = document.getElementById('link-url');
            if(t.value && u.value) {
                await addDoc(linksRef, { nombre: t.value, url: u.value, user: auth.currentUser.email, createdAt: serverTimestamp() });
                t.value = ""; u.value = ""; showToast("Enlace publicado");
            }
        };
        onSnapshot(query(linksRef, orderBy("createdAt", "desc")), (snap) => {
            const html = snap.docs.map(d => `
                <a href="${d.data().url}" target="_blank" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col gap-1 group">
                    <span class="font-black text-slate-800 group-hover:text-blue-600 uppercase text-[9px] tracking-widest">${d.data().nombre}</span>
                    <span class="text-[8px] text-slate-400 italic">Por: ${d.data().user || 'Sistema'}</span>
                </a>`).join('');
            document.getElementById('links-container').innerHTML = html;
            
            // Lista para Admin
            document.getElementById('admin-links-list').innerHTML = snap.docs.map(d => `
                <li class="flex justify-between items-center py-2 text-[10px] font-bold">
                    <span class="truncate w-32">${d.data().nombre}</span>
                    <button onclick="deleteLink('${d.id}')" class="text-red-500 uppercase">Borrar</button>
                </li>`).join('');
        });

        window.deleteLink = async (id) => { 
            await deleteDoc(doc(db, "enlaces", id));
            showToast("Enlace eliminado");
        };

        // --- MI CUENTA ---
        document.getElementById('btnUpdateProfile').onclick = async () => {
            await updateProfile(auth.currentUser, { displayName: document.getElementById('display-name-input').value });
            showToast("Nombre actualizado");
            setTimeout(() => location.reload(), 1000);
        };
        document.getElementById('btnUpdatePass').onclick = async () => {
            const newPass = document.getElementById('new-password-input').value;
            if (newPass.length >= 6) {
                await updatePassword(auth.currentUser, newPass);
                showToast("Clave cambiada");
                document.getElementById('new-password-input').value = "";
            } else { showToast("Mínimo 6 caracteres", "error"); }
        };

        // --- ADMIN OTROS ---
        document.getElementById('btnSaveAnn').onclick = async () => {
            await setDoc(doc(db, "configuracion", "anuncio"), { titulo: document.getElementById('admin-ann-title').value, mensaje: document.getElementById('admin-ann-body').value });
            showToast("Anuncio publicado");
        };
        document.getElementById('btnDeleteAnn').onclick = async () => {
            await deleteDoc(doc(db, "configuracion", "anuncio"));
            showToast("Anuncio eliminado");
        };
        document.getElementById('btnAddUser').onclick = async () => {
            const email = document.getElementById('new-user-email').value.toLowerCase().trim();
            if(email) { await setDoc(doc(db, "usuarios_autorizados", email), { email }); showToast("Autorizado"); }
        };
        onSnapshot(collection(db, "usuarios_autorizados"), (snap) => {
            document.getElementById('user-list').innerHTML = snap.docs.map(d => `
                <li class="py-2 flex justify-between items-center text-[10px] font-black uppercase text-slate-400">
                    <span>${d.id}</span>
                    <button onclick="removeUser('${d.id}')" class="text-red-400">Quitar</button>
                </li>`).join('');
        });
        window.removeUser = async (id) => { await deleteDoc(doc(db, "usuarios_autorizados", id)); showToast("Acceso quitado"); };
        window.clearChat = async () => { (await getDocs(chatRef)).forEach(d => deleteDoc(d.ref)); showToast("Chat vaciado"); };
    </script>
</body>
</html>
