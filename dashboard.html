<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: #f8fafc; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="toast-container"></div>

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <h2 class="text-xl font-black text-blue-600 tracking-tighter italic uppercase">Intranet 2.0</h2>
        <div class="flex items-center gap-4 text-sm font-medium">
            <span id="user-name" class="text-slate-600 bg-slate-100 px-3 py-1 rounded-full text-xs font-bold uppercase">Cargando...</span>
            <button id="btnLogout" class="text-red-500 hover:text-red-700 transition font-bold uppercase text-[10px]">Salir</button>
        </div>
    </header>

    <nav class="flex justify-center bg-white border-b sticky top-14 z-10 overflow-x-auto">
        <button onclick="showTab('inicio')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest nav-active">Inicio</button>
        <button onclick="showTab('enlaces')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Enlaces</button>
        <button onclick="showTab('chat')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Grupo</button>
        <button onclick="showTab('mensajes')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest text-emerald-600">Privados</button>
        <button onclick="showTab('cuenta')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Mi Perfil</button>
        <button id="admin-tab" onclick="showTab('admin')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest hidden text-purple-600">Admin</button>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-6">
        
        <section id="inicio" class="tab-content active-tab space-y-6">
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-8 rounded-[2rem] text-white shadow-2xl">
                <h3 id="welcome-text" class="text-3xl font-black mb-2 italic tracking-tighter text-blue-400">HOLA</h3>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]"></p>
            </div>

            <div id="unread-panel" class="bg-white border border-emerald-100 p-6 rounded-[2rem] shadow-sm hidden">
                <h4 class="font-black text-emerald-600 uppercase text-[10px] tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    Mensajes No Leídos
                </h4>
                <div id="unread-list" class="space-y-3"></div>
            </div>

            <div id="announcement-container" class="hidden">
                <div class="bg-amber-50 border border-amber-100 p-6 rounded-[2rem] shadow-sm">
                    <h4 id="announcement-title" class="font-black text-amber-800 uppercase text-[10px] tracking-widest mb-1">AVISO</h4>
                    <p id="announcement-body" class="text-amber-900 text-sm font-medium"></p>
                </div>
            </div>
        </section>
        
        <section id="enlaces" class="tab-content space-y-6">
            <div class="bg-blue-600 p-6 rounded-[2rem] shadow-lg space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="link-title" class="px-4 py-3 rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="Nombre">
                    <input type="url" id="link-url" class="px-4 py-3 rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="https://...">
                    <button id="btnSaveLink" class="bg-white text-blue-600 px-6 py-3 rounded-2xl font-black text-xs uppercase">Añadir</button>
                </div>
            </div>
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 font-bold"></div>
        </section>

        <section id="chat" class="tab-content space-y-4">
            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[65vh] max-w-2xl mx-auto">
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 custom-scroll"></div>
                <div class="p-4 bg-white border-t flex gap-2">
                    <input type="text" id="chat-input" placeholder="Mensaje al grupo..." class="flex-1 px-4 py-3 border rounded-2xl outline-none bg-slate-100 text-sm font-bold">
                    <button id="btnSend" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase">Enviar</button>
                </div>
            </div>
        </section>

        <section id="mensajes" class="tab-content h-[75vh]">
            <div class="bg-white rounded-[2rem] shadow-2xl border border-slate-200 h-full flex overflow-hidden">
                <div class="w-1/3 border-r flex flex-col bg-slate-50">
                    <div class="p-4 border-b bg-white">
                        <h3 class="font-black text-[10px] uppercase tracking-widest text-slate-400">Contactos</h3>
                    </div>
                    <div id="contacts-list" class="flex-1 overflow-y-auto custom-scroll"></div>
                </div>
                <div class="flex-1 flex flex-col bg-white">
                    <div id="chat-header" class="p-4 border-b flex items-center gap-3 bg-white">
                        <div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold text-xs uppercase" id="current-chat-avatar">?</div>
                        <div class="flex flex-col">
                            <span id="current-chat-name" class="font-black text-xs uppercase text-slate-700 tracking-tight">Selecciona un chat</span>
                            <span id="current-chat-status" class="text-[8px] font-bold uppercase text-slate-400">---</span>
                        </div>
                    </div>
                    <div id="private-messages-container" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 custom-scroll"></div>
                    <div class="p-4 bg-white border-t flex gap-2">
                        <input type="text" id="private-input" placeholder="Escribe un mensaje privado..." class="flex-1 px-4 py-3 border rounded-2xl outline-none bg-slate-100 text-sm font-bold" disabled>
                        <button id="btnSendPrivate" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase opacity-50 cursor-not-allowed" disabled>Enviar</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="cuenta" class="tab-content space-y-6 max-w-xl mx-auto">
            <h3 class="text-2xl font-black text-slate-800 uppercase italic">Mi Perfil</h3>
            <div class="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-100 space-y-6">
                <div class="space-y-2 text-xs font-black uppercase tracking-widest text-slate-400">
                    <label>Nombre Público</label>
                    <div class="flex gap-2">
                        <input type="text" id="display-name-input" class="flex-1 px-4 py-3 border rounded-2xl bg-slate-50 outline-none" placeholder="Nombre">
                        <button id="btnUpdateProfile" class="bg-blue-600 text-white px-5 py-2 rounded-2xl font-black text-[10px]">OK</button>
                    </div>
                </div>
                <div class="space-y-2 text-xs font-black uppercase tracking-widest text-slate-400 pt-4 border-t">
                    <label>Nueva contraseña</label>
                    <input type="password" id="new-password-input" class="w-full px-4 py-3 border rounded-2xl bg-slate-50 outline-none mb-2" placeholder="••••••">
                    <button id="btnUpdatePass" class="w-full bg-slate-800 text-white py-3 rounded-2xl font-black text-xs uppercase">Guardar Clave</button>
                </div>
            </div>
        </section>

        <section id="admin" class="tab-content space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-purple-100 space-y-4">
                    <h4 class="font-black text-slate-800 text-[10px] uppercase tracking-widest text-purple-600">📢 Anuncio</h4>
                    <input type="text" id="admin-ann-title" class="w-full px-4 py-2 border rounded-xl outline-none" placeholder="Título">
                    <textarea id="admin-ann-body" rows="2" class="w-full px-4 py-2 border rounded-xl outline-none text-sm" placeholder="Mensaje..."></textarea>
                    <div class="flex gap-2">
                        <button id="btnSaveAnn" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-black text-[10px] uppercase">Publicar</button>
                        <button id="btnDeleteAnn" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase">Quitar</button>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-purple-100">
                    <h4 class="font-black text-slate-800 text-[10px] uppercase mb-4 tracking-widest text-purple-600">👤 Usuarios</h4>
                    <div class="flex gap-2 mb-4">
                        <input type="email" id="new-user-email" class="flex-1 px-3 py-2 border rounded-xl outline-none text-sm font-bold" placeholder="email@empresa.com">
                        <button id="btnAddUser" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Añadir</button>
                    </div>
                    <ul id="user-list" class="divide-y max-h-40 overflow-y-auto"></ul>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJd8syrMPQunEfBTH0sf9Khj_mSTkWeto",
            authDomain: "intranet-ba388.firebaseapp.com",
            projectId: "intranet-ba388",
            storageBucket: "intranet-ba388.firebasestorage.app",
            messagingSenderId: "104208696906",
            appId: "1:104208696906:web:1dc5ddf05d28d3eb89c8b3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const adminEmails = ["u6282143640@gmail.com", "alvaro.guerreromaldonado@alumno.fomento.edu"]; 
        let activeChatEmail = null;

        const showToast = (msg, type = "success") => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast mb-2 px-6 py-3 rounded-2xl shadow-lg text-white font-bold text-xs uppercase tracking-widest ${type === 'success' ? 'bg-blue-600' : 'bg-red-500'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('nav-active'));
            const target = document.getElementById(tabId);
            if(target) target.classList.add('active-tab');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('onclick').includes(`'${tabId}'`)) btn.classList.add('nav-active');
            });
        };

        // --- GESTIÓN DE PRESENCIA ---
        const setOnlineStatus = async (status) => {
            if (auth.currentUser) {
                await setDoc(doc(db, "presencia", auth.currentUser.email), {
                    online: status,
                    lastChanged: serverTimestamp()
                }, { merge: true });
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                document.getElementById('user-name').innerText = name;
                document.getElementById('display-name-input').value = user.displayName || "";
                document.getElementById('welcome-text').innerText = `HOLA, ${name.toUpperCase()}`;
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                if (adminEmails.includes(user.email)) document.getElementById('admin-tab').classList.remove('hidden');
                
                // Marcar como ONLINE
                await setOnlineStatus(true);
                // Escuchar no leídos
                listenToUnreadMessages(user.email);
            } else { 
                window.location.href = "index.html"; 
            }
        });

        // Marcar offline al cerrar
        window.addEventListener('beforeunload', () => setOnlineStatus(false));
        document.getElementById('btnLogout').onclick = async () => {
            await setOnlineStatus(false);
            signOut(auth);
        };

        // --- MENSAJES NO LEÍDOS (LÓGICA INICIO) ---
        const listenToUnreadMessages = (myEmail) => {
            const q = query(collection(db, "chats_privados"), where("receiver", "==", myEmail), where("read", "==", false));
            onSnapshot(q, (snap) => {
                const unreadPanel = document.getElementById('unread-panel');
                const unreadList = document.getElementById('unread-list');
                const counts = {};

                snap.docs.forEach(d => {
                    const sender = d.data().sender;
                    counts[sender] = (counts[sender] || 0) + 1;
                });

                const senders = Object.keys(counts);
                if (senders.length > 0) {
                    unreadPanel.classList.remove('hidden');
                    unreadList.innerHTML = senders.map(s => `
                        <div onclick="showTab('mensajes'); openPrivateChat('${s}')" class="flex justify-between items-center bg-emerald-50 p-3 rounded-2xl cursor-pointer hover:bg-emerald-100 transition">
                            <span class="text-[10px] font-black uppercase text-emerald-800 truncate w-40">${s}</span>
                            <span class="bg-emerald-500 text-white px-2 py-1 rounded-full text-[9px] font-bold">${counts[s]} nuevos</span>
                        </div>
                    `).join('');
                } else {
                    unreadPanel.classList.add('hidden');
                }
            });
        };

        // --- CHAT PRIVADO CORREGIDO CON PRESENCIA ---
        const privRef = collection(db, "chats_privados");
        
        onSnapshot(collection(db, "usuarios_autorizados"), (snap) => {
            const list = document.getElementById('contacts-list');
            const userEmails = snap.docs.map(d => d.id).filter(email => email !== auth.currentUser?.email);
            
            // Escuchar presencia de cada usuario
            onSnapshot(collection(db, "presencia"), (presSnap) => {
                const presenceData = {};
                presSnap.docs.forEach(d => presenceData[d.id] = d.data().online);

                list.innerHTML = userEmails.map(email => {
                    const isOnline = presenceData[email] || false;
                    return `
                    <div onclick="openPrivateChat('${email}')" class="p-4 border-b hover:bg-white cursor-pointer transition flex items-center gap-3">
                        <div class="relative">
                            <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-[10px] font-black uppercase text-slate-500">${email.substring(0,2)}</div>
                            <div class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${isOnline ? 'bg-emerald-500' : 'bg-slate-400'}"></div>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="font-bold text-[11px] text-slate-700 truncate uppercase">${email}</span>
                            <span class="text-[8px] font-black uppercase ${isOnline ? 'text-emerald-500' : 'text-slate-400'}">
                                ${isOnline ? 'En línea' : 'Desconectado'}
                            </span>
                        </div>
                    </div>`;
                }).join('');

                // Actualizar estado en la cabecera del chat abierto
                if(activeChatEmail) {
                    const isOnline = presenceData[activeChatEmail] || false;
                    const statusEl = document.getElementById('current-chat-status');
                    statusEl.innerText = isOnline ? 'En línea' : 'Desconectado';
                    statusEl.className = `text-[8px] font-black uppercase ${isOnline ? 'text-emerald-500' : 'text-slate-400'}`;
                }
            });
        });

        window.openPrivateChat = async (email) => {
            activeChatEmail = email;
            document.getElementById('current-chat-name').innerText = email;
            document.getElementById('current-chat-avatar').innerText = email.substring(0,2);
            document.getElementById('private-input').disabled = false;
            document.getElementById('btnSendPrivate').disabled = false;
            document.getElementById('btnSendPrivate').classList.remove('opacity-50', 'cursor-not-allowed');
            
            // Marcar mensajes como LEÍDOS
            const qUnread = query(privRef, where("sender", "==", email), where("receiver", "==", auth.currentUser.email), where("read", "==", false));
            const toMark = await getDocs(qUnread);
            toMark.forEach(d => updateDoc(d.ref, { read: true }));

            // Escuchar chat
            onSnapshot(query(privRef, orderBy("timestamp", "asc")), (snap) => {
                if(activeChatEmail !== email) return;
                const filtered = snap.docs.filter(d => 
                    (d.data().sender === auth.currentUser.email && d.data().receiver === email) || 
                    (d.data().sender === email && d.data().receiver === auth.currentUser.email)
                );
                const box = document.getElementById('private-messages-container');
                box.innerHTML = filtered.map(d => `
                    <div class="flex flex-col ${d.data().sender === auth.currentUser.email ? 'items-end' : 'items-start'}">
                        <div class="${d.data().sender === auth.currentUser.email ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-800'} p-3 rounded-2xl shadow-sm max-w-[85%]">
                            <p class="text-sm font-bold tracking-tight">${d.data().text}</p>
                        </div>
                    </div>`).join('');
                box.scrollTop = box.scrollHeight;
            });
        };

        document.getElementById('btnSendPrivate').onclick = async () => {
            const input = document.getElementById('private-input');
            if(input.value.trim() && activeChatEmail) {
                await addDoc(privRef, {
                    sender: auth.currentUser.email,
                    receiver: activeChatEmail,
                    text: input.value,
                    read: false,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            }
        };

        // --- CHAT GRUPAL (Sin cambios) ---
        document.getElementById('btnSend').onclick = async () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim()) {
                await addDoc(collection(db, "chat"), { text: input.value, user: auth.currentUser.displayName || auth.currentUser.email.split('@')[0], timestamp: serverTimestamp() });
                input.value = "";
            }
        };
        onSnapshot(query(collection(db, "chat"), orderBy("timestamp", "asc")), (snap) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = snap.docs.map(d => `
                <div class="flex flex-col ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'items-end' : 'items-start'}">
                    <div class="max-w-[85%] ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl' : 'bg-white text-slate-800 rounded-r-2xl rounded-tl-2xl border'} p-3 shadow-sm">
                        <p class="text-[8px] font-black opacity-50 uppercase mb-1">${d.data().user}</p>
                        <p class="text-sm font-bold tracking-tight">${d.data().text}</p>
                    </div>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        });

        // --- ENLACES Y OTROS ---
        onSnapshot(query(collection(db, "enlaces"), orderBy("createdAt", "desc")), (snap) => {
            document.getElementById('links-container').innerHTML = snap.docs.map(d => `
                <a href="${d.data().url}" target="_blank" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col gap-1 group transition hover:shadow-lg">
                    <span class="font-black text-slate-800 group-hover:text-blue-600 uppercase text-[9px] tracking-widest">${d.data().nombre}</span>
                    <span class="text-[8px] text-slate-400 italic">Por: ${d.data().user}</span>
                </a>`).join('');
        });
        document.getElementById('btnSaveLink').onclick = async () => {
            const t = document.getElementById('link-title'), u = document.getElementById('link-url');
            if(t.value && u.value) {
                await addDoc(collection(db, "enlaces"), { nombre: t.value, url: u.value, user: auth.currentUser.email, createdAt: serverTimestamp() });
                t.value = ""; u.value = ""; showToast("Enlace añadido");
            }
        };
        onSnapshot(doc(db, "configuracion", "anuncio"), (doc) => {
            const container = document.getElementById('announcement-container');
            if (doc.exists()) {
                container.classList.remove('hidden');
                document.getElementById('announcement-title').innerText = doc.data().titulo;
                document.getElementById('announcement-body').innerText = doc.data().mensaje;
            } else { container.classList.add('hidden'); }
        });
    </script>
</body>
</html>
