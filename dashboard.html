<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <h2 class="text-xl font-black text-blue-600 tracking-tighter italic">MI INTRANET</h2>
        <div class="flex items-center gap-4 text-sm font-medium">
            <span id="user-name" class="text-slate-600 bg-slate-100 px-3 py-1 rounded-full text-xs">Cargando...</span>
            <button id="btnLogout" class="text-red-500 hover:text-red-700 transition font-bold">Salir</button>
        </div>
    </header>

    <nav class="flex justify-center bg-white border-b sticky top-14 z-10 overflow-x-auto">
        <button onclick="showTab('inicio')" class="tab-btn px-6 py-4 font-bold text-sm uppercase tracking-wider nav-active">Inicio</button>
        <button onclick="showTab('enlaces')" class="tab-btn px-6 py-4 font-bold text-sm uppercase tracking-wider">Enlaces</button>
        <button onclick="showTab('chat')" class="tab-btn px-6 py-4 font-bold text-sm uppercase tracking-wider">Chat</button>
        <button onclick="showTab('cuenta')" class="tab-btn px-6 py-4 font-bold text-sm uppercase tracking-wider">Mi Cuenta</button>
        <button id="admin-tab" onclick="showTab('admin')" class="tab-btn px-6 py-4 font-bold text-sm uppercase tracking-wider hidden text-purple-600">Admin</button>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        
        <section id="inicio" class="tab-content active-tab space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-blue-400 p-8 rounded-3xl text-white shadow-lg">
                <h3 id="welcome-text" class="text-3xl font-bold italic mb-2">¡Hola!</h3>
                <p class="opacity-90 font-medium text-sm md:text-base">Bienvenido al panel central de la intranet.</p>
                <p id="current-date" class="mt-4 text-xs font-bold bg-blue-700 bg-opacity-30 inline-block px-3 py-1 rounded-lg"></p>
            </div>

            <div id="announcement-container" class="hidden">
                <div class="bg-amber-50 border-l-4 border-amber-400 p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-amber-600">⚠️</span>
                        <h4 id="announcement-title" class="font-black text-amber-800 uppercase text-xs tracking-widest">AVISO IMPORTANTE</h4>
                    </div>
                    <p id="announcement-body" class="text-amber-900 text-sm font-medium leading-relaxed"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h4 class="font-black text-slate-800 uppercase text-[10px] tracking-widest mb-4">Sistemas</h4>
                    <div class="flex items-center gap-3 text-green-500 font-bold text-sm">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        Servicios Activos
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-center">
                    <button onclick="showTab('chat')" class="bg-slate-800 text-white px-6 py-3 rounded-2xl font-bold hover:bg-black transition w-full text-sm">Abrir Chat Grupal</button>
                </div>
            </div>
        </section>
        
        <section id="enlaces" class="tab-content space-y-4">
            <h3 class="text-2xl font-bold text-slate-800">Enlaces Rápidos</h3>
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <section id="chat" class="tab-content space-y-4">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[65vh] max-w-2xl mx-auto">
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50"></div>
                <div class="p-4 bg-white border-t flex gap-2">
                    <input type="text" id="chat-input" placeholder="Mensaje..." class="flex-1 px-4 py-3 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm font-medium">
                    <button id="btnSend" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-blue-700 transition">Enviar</button>
                </div>
            </div>
        </section>

        <section id="cuenta" class="tab-content space-y-6 max-w-xl mx-auto">
            <h3 class="text-2xl font-bold text-slate-800">Configuración</h3>
            <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 space-y-6 font-medium">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nombre</label>
                    <div class="flex gap-2">
                        <input type="text" id="display-name-input" class="flex-1 px-4 py-2 border rounded-xl bg-slate-50 outline-none" placeholder="Tu nombre">
                        <button id="btnUpdateProfile" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs">OK</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nueva Contraseña</label>
                    <input type="password" id="new-password-input" class="w-full px-4 py-2 border rounded-xl bg-slate-50 outline-none" placeholder="••••••">
                    <button id="btnUpdatePass" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-sm">Cambiar Clave</button>
                </div>
            </div>
        </section>

        <section id="admin" class="tab-content space-y-6">
            <h3 class="text-2xl font-bold text-purple-700">Panel Admin</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-purple-100 space-y-4">
                    <h4 class="font-black text-slate-800 text-xs uppercase">📢 Publicar Anuncio en Inicio</h4>
                    <input type="text" id="admin-ann-title" class="w-full px-4 py-2 border rounded-xl outline-none" placeholder="Título del aviso">
                    <textarea id="admin-ann-body" rows="3" class="w-full px-4 py-2 border rounded-xl outline-none" placeholder="Mensaje del anuncio..."></textarea>
                    <div class="flex gap-2">
                        <button id="btnSaveAnn" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-bold text-xs">Publicar</button>
                        <button id="btnDeleteAnn" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold text-xs italic">Quitar</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-purple-100">
                    <h4 class="font-black text-slate-800 text-xs uppercase mb-4 text-purple-600">👤 Usuarios Autorizados</h4>
                    <div class="flex gap-2 mb-4">
                        <input type="email" id="new-user-email" class="flex-1 px-3 py-2 border rounded-xl outline-none" placeholder="email@empresa.com">
                        <button id="btnAddUser" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold text-xs">Añadir</button>
                    </div>
                    <ul id="user-list" class="divide-y max-h-40 overflow-y-auto"></ul>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 md:col-span-2">
                    <h4 class="font-black text-slate-800 text-xs uppercase">🔗 Gestión de Enlaces</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="link-title" class="px-4 py-2 border rounded-xl outline-none" placeholder="Nombre">
                        <input type="url" id="link-url" class="px-4 py-2 border rounded-xl outline-none" placeholder="https://...">
                    </div>
                    <button id="btnSaveLink" class="w-full bg-slate-800 text-white py-2 rounded-xl font-bold text-xs uppercase tracking-widest">Añadir Enlace</button>
                    <button onclick="clearChat()" class="w-full text-red-500 font-bold py-2 text-xs uppercase hover:bg-red-50 rounded-xl transition">Borrar Historial Chat</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJd8syrMPQunEfBTH0sf9Khj_mSTkWeto",
            authDomain: "intranet-ba388.firebaseapp.com",
            projectId: "intranet-ba388",
            storageBucket: "intranet-ba388.firebasestorage.app",
            messagingSenderId: "104208696906",
            appId: "1:104208696906:web:1dc5ddf05d28d3eb89c8b3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const adminEmails = ["alvaro.guerreromaldonado@alumno.fomento.edu", "u6282143640@gmail.com"]; // CAMBIA ESTO CON TU EMAIL

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('nav-active'));
            const target = document.getElementById(tabId);
            if(target) target.classList.add('active-tab');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('onclick').includes(`'${tabId}'`)) btn.classList.add('nav-active');
            });
        };

        const updateWelcomeMessage = (name) => {
            const hour = new Date().getHours();
            let greet = hour < 12 ? "¡Buenos días" : hour < 20 ? "¡Buenas tardes" : "¡Buenas noches";
            document.getElementById('welcome-text').innerText = `${greet}, ${name}!`;
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                document.getElementById('user-name').innerText = name;
                document.getElementById('display-name-input').value = user.displayName || "";
                updateWelcomeMessage(name);
                if (adminEmails.includes(user.email)) document.getElementById('admin-tab').classList.remove('hidden');
            } else { window.location.href = "index.html"; }
        });

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // --- LÓGICA ANUNCIOS (Firestore) ---
        onSnapshot(doc(db, "configuracion", "anuncio"), (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                document.getElementById('announcement-container').classList.remove('hidden');
                document.getElementById('announcement-title').innerText = data.titulo;
                document.getElementById('announcement-body').innerText = data.mensaje;
            } else {
                document.getElementById('announcement-container').classList.add('hidden');
            }
        });

        document.getElementById('btnSaveAnn').onclick = async () => {
            const tit = document.getElementById('admin-ann-title').value;
            const msg = document.getElementById('admin-ann-body').value;
            if(tit && msg) {
                await setDoc(doc(db, "configuracion", "anuncio"), { titulo: tit, mensaje: msg, fecha: serverTimestamp() });
                alert("Anuncio publicado");
            }
        };
        document.getElementById('btnDeleteAnn').onclick = async () => {
            await deleteDoc(doc(db, "configuracion", "anuncio"));
            alert("Anuncio quitado");
        };

        // --- CHAT ---
        const chatRef = collection(db, "chat");
        document.getElementById('btnSend').onclick = async () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim()) {
                await addDoc(chatRef, { text: input.value, user: auth.currentUser.displayName || auth.currentUser.email.split('@')[0], timestamp: serverTimestamp() });
                input.value = "";
            }
        };
        onSnapshot(query(chatRef, orderBy("timestamp", "asc")), (snap) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = snap.docs.map(d => `
                <div class="flex flex-col ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'items-end' : 'items-start'}">
                    <div class="max-w-[85%] ${d.data().user === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) ? 'bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl' : 'bg-white text-slate-800 rounded-r-2xl rounded-tl-2xl border'} p-3 shadow-sm">
                        <p class="text-[8px] font-black opacity-50 uppercase mb-1">${d.data().user}</p>
                        <p class="text-sm font-medium">${d.data().text}</p>
                    </div>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        });

        // --- ENLACES ---
        const linksRef = collection(db, "enlaces");
        document.getElementById('btnSaveLink').onclick = async () => {
            const t = document.getElementById('link-title'), u = document.getElementById('link-url');
            if(t.value && u.value) {
                await addDoc(linksRef, { nombre: t.value, url: u.value, createdAt: serverTimestamp() });
                t.value = ""; u.value = "";
            }
        };
        onSnapshot(query(linksRef, orderBy("createdAt", "desc")), (snap) => {
            document.getElementById('links-container').innerHTML = snap.docs.map(d => `
                <a href="${d.data().url}" target="_blank" class="bg-white p-6 rounded-3xl shadow-sm hover:shadow-xl transition-all border border-slate-100 flex flex-col gap-1 group">
                    <span class="font-black text-slate-800 group-hover:text-blue-600 uppercase text-[9px] tracking-widest">${d.data().nombre}</span>
                    <span class="text-xs text-slate-400 truncate font-medium italic">${d.data().url}</span>
                </a>`).join('');
        });

        // --- MI CUENTA ---
        document.getElementById('btnUpdateProfile').onclick = async () => {
            try {
                await updateProfile(auth.currentUser, { displayName: document.getElementById('display-name-input').value });
                alert("Nombre actualizado");
                location.reload();
            } catch (e) { alert("Error"); }
        };
        document.getElementById('btnUpdatePass').onclick = async () => {
            const newPass = document.getElementById('new-password-input').value;
            if (newPass.length < 6) return alert("Muy corta");
            try {
                await updatePassword(auth.currentUser, newPass);
                alert("Hecho");
                document.getElementById('new-password-input').value = "";
            } catch (e) { alert("Re-inicia sesión"); }
        };

        // --- ADMIN USUARIOS ---
        document.getElementById('btnAddUser').onclick = async () => {
            const email = document.getElementById('new-user-email').value.toLowerCase().trim();
            if(email) await setDoc(doc(db, "usuarios_autorizados", email), { email, addedAt: serverTimestamp() });
        };
        onSnapshot(collection(db, "usuarios_autorizados"), (snap) => {
            document.getElementById('user-list').innerHTML = snap.docs.map(d => `
                <li class="py-2 flex justify-between items-center text-[10px] font-bold uppercase">
                    <span class="text-slate-400">${d.id}</span>
                    <button onclick="removeUser('${d.id}')" class="text-red-400 hover:text-red-600">Revocar</button>
                </li>`).join('');
        });
        window.removeUser = async (id) => { if(confirm("¿Quitar?")) await deleteDoc(doc(db, "usuarios_autorizados", id)); };
        window.clearChat = async () => { if(confirm("¿Borrar?")) (await getDocs(chatRef)).forEach(d => deleteDoc(d.ref)); };
    </script>
</body>
</html>
