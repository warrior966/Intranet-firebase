<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Intranet 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: #f8fafc; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        #impersonation-bar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="toast-container"></div>

    <div id="impersonation-bar" class="bg-red-600 text-white px-6 py-2 flex justify-between items-center sticky top-0 z-50 animate-pulse">
        <span class="text-[10px] font-black uppercase tracking-widest">⚠️ MODO SUPLANTACIÓN ACTIVO: <span id="shadow-target-name">---</span></span>
        <button onclick="stopImpersonation()" class="bg-white text-red-600 px-3 py-1 rounded-full text-[9px] font-black uppercase">Detener</button>
    </div>

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <h2 class="text-xl font-black text-blue-600 tracking-tighter italic uppercase">Intranet 2.0</h2>
        <div class="flex items-center gap-4 text-sm font-medium">
            <span id="user-name" class="text-slate-600 bg-slate-100 px-3 py-1 rounded-full text-xs font-bold uppercase">Cargando...</span>
            <button id="btnLogout" class="text-red-500 hover:text-red-700 transition font-bold uppercase text-[10px]">Salir</button>
        </div>
    </header>

    <nav class="flex justify-center bg-white border-b sticky top-14 z-10 overflow-x-auto">
        <button onclick="showTab('inicio')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest nav-active">Inicio</button>
        <button onclick="showTab('enlaces')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Enlaces</button>
        <button onclick="showTab('chat')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Grupo</button>
        <button onclick="showTab('mensajes')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest text-emerald-600">Privados</button>
        <button onclick="showTab('cuenta')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest">Perfil</button>
        <button id="admin-tab" onclick="showTab('admin')" class="tab-btn px-6 py-4 font-bold text-[11px] uppercase tracking-widest hidden text-purple-600">Admin</button>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-6">
        
        <section id="inicio" class="tab-content active-tab space-y-6">
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-8 rounded-[2rem] text-white shadow-2xl">
                <h3 id="welcome-text" class="text-3xl font-black mb-2 italic tracking-tighter text-blue-400 uppercase">HOLA</h3>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]"></p>
            </div>
            <div id="unread-panel" class="bg-white border border-emerald-100 p-6 rounded-[2rem] shadow-sm hidden">
                <h4 class="font-black text-emerald-600 uppercase text-[10px] tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Mensajes Nuevos
                </h4>
                <div id="unread-list" class="space-y-3"></div>
            </div>
            <div id="announcement-container" class="hidden">
                <div class="bg-amber-50 border border-amber-100 p-6 rounded-[2rem]">
                    <h4 id="announcement-title" class="font-black text-amber-800 uppercase text-[10px] tracking-widest mb-1">AVISO</h4>
                    <p id="announcement-body" class="text-amber-900 text-sm font-medium"></p>
                </div>
            </div>
        </section>
        
        <section id="enlaces" class="tab-content space-y-6">
            <div class="bg-blue-600 p-6 rounded-[2rem] shadow-lg space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="link-title" class="px-4 py-3 rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="Nombre">
                    <input type="url" id="link-url" class="px-4 py-3 rounded-2xl outline-none text-sm font-bold bg-white/10 text-white placeholder-white/50" placeholder="https://...">
                    <button id="btnSaveLink" class="bg-white text-blue-600 px-6 py-3 rounded-2xl font-black text-xs uppercase">Añadir</button>
                </div>
            </div>
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 font-bold"></div>
        </section>

        <section id="chat" class="tab-content space-y-4">
            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[65vh] max-w-2xl mx-auto">
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 custom-scroll"></div>
                <div class="p-4 bg-white border-t flex gap-2">
                    <input type="text" id="chat-input" placeholder="Mensaje al grupo..." class="flex-1 px-4 py-3 border rounded-2xl outline-none bg-slate-100 text-sm font-bold">
                    <button id="btnSend" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase">Enviar</button>
                </div>
            </div>
        </section>

        <section id="mensajes" class="tab-content h-[75vh]">
            <div class="bg-white rounded-[2rem] shadow-2xl border border-slate-200 h-full flex overflow-hidden">
                <div class="w-1/3 border-r flex flex-col bg-slate-50">
                    <div class="p-4 border-b bg-white"><h3 class="font-black text-[10px] uppercase text-slate-400">Contactos</h3></div>
                    <div id="contacts-list" class="flex-1 overflow-y-auto custom-scroll"></div>
                </div>
                <div class="flex-1 flex flex-col bg-white">
                    <div id="chat-header" class="p-4 border-b flex items-center gap-3">
                        <div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold text-xs" id="current-chat-avatar">?</div>
                        <div class="flex flex-col">
                            <span id="current-chat-name" class="font-black text-xs uppercase text-slate-700">Selecciona un chat</span>
                            <span id="current-chat-status" class="text-[8px] font-black uppercase text-slate-400">---</span>
                        </div>
                    </div>
                    <div id="private-messages-container" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 custom-scroll"></div>
                    <div class="p-4 bg-white border-t flex gap-2">
                        <input type="text" id="private-input" placeholder="Escribe..." class="flex-1 px-4 py-3 border rounded-2xl outline-none bg-slate-100 text-sm font-bold" disabled>
                        <button id="btnSendPrivate" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl font-black text-xs opacity-50" disabled>Enviar</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="cuenta" class="tab-content space-y-6 max-w-xl mx-auto">
            <h3 class="text-2xl font-black text-slate-800 uppercase italic">Mi Perfil</h3>
            <div class="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-100 space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase text-slate-400">Nombre Público</label>
                    <div class="flex gap-2">
                        <input type="text" id="display-name-input" class="flex-1 px-4 py-3 border rounded-2xl bg-slate-50 outline-none font-bold">
                        <button id="btnUpdateProfile" class="bg-blue-600 text-white px-5 py-2 rounded-2xl font-black text-[10px]">OK</button>
                    </div>
                </div>
                <div class="pt-6 border-t space-y-2">
                    <label class="text-xs font-black uppercase text-slate-400">Nueva Contraseña</label>
                    <input type="password" id="new-password-input" class="w-full px-4 py-3 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Mínimo 6 caracteres">
                    <button id="btnUpdatePass" class="w-full bg-slate-800 text-white py-3 rounded-2xl font-black text-xs uppercase">Actualizar Clave</button>
                </div>
            </div>
        </section>

        <section id="admin" class="tab-content space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-[2rem] border border-purple-100">
                    <h4 class="font-black text-purple-600 text-[10px] uppercase mb-4 tracking-widest">👤 Usuarios</h4>
                    <div class="flex gap-2 mb-4">
                        <input type="email" id="new-user-email" class="flex-1 px-3 py-2 border rounded-xl outline-none text-sm font-bold" placeholder="email@empresa.com">
                        <button id="btnAddUser" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Añadir</button>
                    </div>
                    <ul id="user-list" class="divide-y max-h-60 overflow-y-auto custom-scroll"></ul>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border border-purple-100 space-y-4">
                    <h4 class="font-black text-purple-600 text-[10px] uppercase tracking-widest">📢 Anuncio</h4>
                    <input type="text" id="admin-ann-title" class="w-full px-4 py-2 border rounded-xl font-bold" placeholder="Título">
                    <textarea id="admin-ann-body" rows="2" class="w-full px-4 py-2 border rounded-xl text-sm" placeholder="Mensaje..."></textarea>
                    <div class="flex gap-2">
                        <button id="btnSaveAnn" class="flex-1 bg-purple-600 text-white py-2 rounded-xl font-black text-[10px]">Publicar</button>
                        <button id="btnDeleteAnn" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-black text-[10px]">Borrar</button>
                    </div>
                </div>
                <div class="md:col-span-2 bg-white p-6 rounded-[2rem] border border-purple-100">
                    <h4 class="font-black text-purple-600 text-[10px] uppercase mb-4">🗑 Limpiar</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <ul id="admin-links-list" class="divide-y bg-slate-50 p-4 rounded-2xl max-h-48 overflow-y-auto"></ul>
                        <button onclick="clearChat()" class="w-full h-20 bg-red-100 text-red-600 font-black text-xs rounded-[2rem]">Vaciar Chat Grupal</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJd8syrMPQunEfBTH0sf9Khj_mSTkWeto",
            authDomain: "intranet-ba388.firebaseapp.com",
            projectId: "intranet-ba388",
            storageBucket: "intranet-ba388.firebasestorage.app",
            messagingSenderId: "104208696906",
            appId: "1:104208696906:web:1dc5ddf05d28d3eb89c8b3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const adminEmails = ["u6282143640@gmail.com", "alvaro.guerreromaldonado@alumno.fomento.edu", "jaime.contreras@alumno.fomento.edu"]; 
        
        let isImpersonating = false;
        let shadowUser = null;
        let activeChatEmail = null;

        const getCurrentUserEmail = () => isImpersonating ? shadowUser : auth.currentUser.email;
        const getCurrentUserName = () => isImpersonating ? shadowUser.split('@')[0] : (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]);

        const showToast = (msg, type = "success") => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast mb-2 px-6 py-3 rounded-2xl shadow-lg text-white font-bold text-xs uppercase tracking-widest ${type === 'success' ? 'bg-blue-600' : 'bg-red-500'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(tabId)?.classList.add('active-tab');
            document.querySelectorAll('.tab-btn').forEach(btn => { if(btn.getAttribute('onclick').includes(`'${tabId}'`)) btn.classList.add('nav-active'); });
        };

        // --- SUPLANTACIÓN ---
        window.startImpersonation = (targetEmail) => {
            isImpersonating = true; shadowUser = targetEmail;
            document.getElementById('impersonation-bar').style.display = 'flex';
            document.getElementById('shadow-target-name').innerText = targetEmail;
            showToast(`Suplantando a ${targetEmail}`);
            listenUnread(targetEmail);
        };
        window.stopImpersonation = () => {
            isImpersonating = false; shadowUser = null;
            document.getElementById('impersonation-bar').style.display = 'none';
            showToast(`Vuelto a cuenta real`);
            listenUnread(auth.currentUser.email);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                document.getElementById('user-name').innerText = name.toUpperCase();
                document.getElementById('display-name-input').value = user.displayName || "";
                document.getElementById('welcome-text').innerText = `HOLA, ${name.toUpperCase()}`;
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                if (adminEmails.includes(user.email)) document.getElementById('admin-tab').classList.remove('hidden');
                await setDoc(doc(db, "presencia", user.email), { online: true, last: serverTimestamp() }, { merge: true });
                listenUnread(user.email);
            } else { window.location.href = "index.html"; }
        });

        // --- ENLACES ---
        document.getElementById('btnSaveLink').onclick = async () => {
            const t = document.getElementById('link-title'), u = document.getElementById('link-url');
            if(t.value && u.value) {
                await addDoc(collection(db, "enlaces"), { nombre: t.value, url: u.value, user: getCurrentUserEmail(), createdAt: serverTimestamp() });
                t.value = ""; u.value = ""; showToast("Enlace añadido");
            }
        };
        onSnapshot(query(collection(db, "enlaces"), orderBy("createdAt", "desc")), (snap) => {
            document.getElementById('links-container').innerHTML = snap.docs.map(d => `<a href="${d.data().url}" target="_blank" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col uppercase text-[10px] italic"><span class="font-black text-slate-800">${d.data().nombre}</span><span class="text-slate-400 font-bold">Por: ${d.data().user}</span></a>`).join('');
            document.getElementById('admin-links-list').innerHTML = snap.docs.map(d => `<li class="flex justify-between py-2 text-[10px] font-bold"><span>${d.data().nombre}</span><button onclick="deleteLink('${d.id}')" class="text-red-500">Borrar</button></li>`).join('');
        });
        window.deleteLink = async (id) => { await deleteDoc(doc(db, "enlaces", id)); showToast("Borrado"); };

        // --- MENSAJES PRIVADOS Y CONTACTOS ---
        onSnapshot(collection(db, "usuarios_autorizados"), (snap) => {
            const emails = snap.docs.map(d => d.id);
            // Actualizar lista admin
            document.getElementById('user-list').innerHTML = snap.docs.map(d => `<li class="py-3 flex justify-between items-center text-[10px] font-black uppercase"><span>${d.id}</span><div class="flex gap-2"><button onclick="startImpersonation('${d.id}')" class="text-purple-600">SUPLANTAR</button><button onclick="removeUser('${d.id}')" class="text-red-400">Quitar</button></div></li>`).join('');
            
            // Actualizar contactos en chat
            onSnapshot(collection(db, "presencia"), (pSnap) => {
                const pres = {}; pSnap.docs.forEach(d => pres[d.id] = d.data().online);
                document.getElementById('contacts-list').innerHTML = emails.filter(e => e !== getCurrentUserEmail()).map(e => `
                    <div onclick="openPrivateChat('${e}')" class="p-4 border-b hover:bg-white cursor-pointer transition flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-[10px] font-black">${e.substring(0,2).toUpperCase()}</div>
                        <div class="flex flex-col">
                            <span class="font-bold text-[11px] uppercase">${e}</span>
                            <span class="text-[8px] font-black uppercase ${pres[e] ? 'text-emerald-500' : 'text-slate-400'}">${pres[e] ? 'Online' : 'Offline'}</span>
                        </div>
                    </div>`).join('');
            });
        });

        window.openPrivateChat = async (email) => {
            activeChatEmail = email;
            document.getElementById('current-chat-name').innerText = email;
            document.getElementById('private-input').disabled = false;
            document.getElementById('btnSendPrivate').disabled = false;
            const myEmail = getCurrentUserEmail();

            onSnapshot(query(collection(db, "chats_privados"), orderBy("timestamp", "asc")), (snap) => {
                if(activeChatEmail !== email) return;
                const filtered = snap.docs.filter(d => (d.data().sender === myEmail && d.data().receiver === email) || (d.data().sender === email && d.data().receiver === myEmail));
                document.getElementById('private-messages-container').innerHTML = filtered.map(d => `
                    <div class="flex flex-col ${d.data().sender === myEmail ? 'items-end' : 'items-start'}">
                        <div class="${d.data().sender === myEmail ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-800'} p-3 rounded-2xl shadow-sm max-w-[85%] text-sm font-bold">
                            ${d.data().text}
                        </div>
                    </div>`).join('');
                document.getElementById('private-messages-container').scrollTop = 99999;
            });
        };

        document.getElementById('btnSendPrivate').onclick = async () => {
            const input = document.getElementById('private-input');
            if(input.value.trim() && activeChatEmail) {
                await addDoc(collection(db, "chats_privados"), { sender: getCurrentUserEmail(), receiver: activeChatEmail, text: input.value, read: false, timestamp: serverTimestamp() });
                input.value = "";
            }
        };

        // --- PERFIL ---
        document.getElementById('btnUpdateProfile').onclick = async () => {
            await updateProfile(auth.currentUser, { displayName: document.getElementById('display-name-input').value });
            showToast("Perfil actualizado");
        };
        document.getElementById('btnUpdatePass').onclick = async () => {
            const pass = document.getElementById('new-password-input').value;
            if(pass.length >= 6) { 
                await updatePassword(auth.currentUser, pass); 
                showToast("Clave cambiada");
                document.getElementById('new-password-input').value = "";
            } else { showToast("Mínimo 6 caracteres", "error"); }
        };

        // --- OTROS ---
        window.removeUser = async (id) => { await deleteDoc(doc(db, "usuarios_autorizados", id)); showToast("Acceso revocado"); };
        window.clearChat = async () => { const snap = await getDocs(collection(db, "chat")); snap.forEach(d => deleteDoc(d.ref)); showToast("Chat vaciado"); };
        document.getElementById('btnAddUser').onclick = async () => {
            const email = document.getElementById('new-user-email').value.toLowerCase().trim();
            if(email) { await setDoc(doc(db, "usuarios_autorizados", email), { email }); showToast("Añadido"); }
        };
        document.getElementById('btnLogout').onclick = async () => { await setDoc(doc(db, "presencia", auth.currentUser.email), { online: false }); signOut(auth); };
        
        const listenUnread = (email) => {
            onSnapshot(query(collection(db, "chats_privados"), where("receiver", "==", email), where("read", "==", false)), (snap) => {
                const panel = document.getElementById('unread-panel');
                if(snap.size > 0) { panel.classList.remove('hidden'); document.getElementById('unread-list').innerHTML = `<p class="text-[10px] font-bold text-emerald-800">Tienes ${snap.size} mensajes nuevos.</p>`; }
                else { panel.classList.add('hidden'); }
            });
        };

        // Chat Grupal
        document.getElementById('btnSend').onclick = async () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim()) {
                await addDoc(collection(db, "chat"), { text: input.value, user: getCurrentUserName(), senderEmail: getCurrentUserEmail(), timestamp: serverTimestamp() });
                input.value = "";
            }
        };
        onSnapshot(query(collection(db, "chat"), orderBy("timestamp", "asc")), (snap) => {
            document.getElementById('chat-messages').innerHTML = snap.docs.map(d => `
                <div class="flex flex-col ${d.data().senderEmail === getCurrentUserEmail() ? 'items-end' : 'items-start'}">
                    <div class="${d.data().senderEmail === getCurrentUserEmail() ? 'bg-blue-600 text-white' : 'bg-white border'} p-3 rounded-2xl shadow-sm max-w-[85%] text-sm font-bold">
                        <p class="text-[8px] uppercase opacity-50 mb-1">${d.data().user}</p>${d.data().text}
                    </div>
                </div>`).join('');
            document.getElementById('chat-messages').scrollTop = 9999;
        });

    </script>
</body>
</html>
