<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet Corporativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-section" class="container">
        <div class="card">
            <h2>🔐 Acceso Intranet</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
            <p id="login-error" style="color: red; font-size: 12px;"></p>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <nav class="navbar">
            <h1>Mi Intranet</h1>
            <div class="nav-right">
                <span id="admin-badge" class="badge" style="display:none;">⭐ Administrador</span>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </nav>

        <div class="grid-container">
            <div class="column">
                <section class="card">
                    <h3>🔗 Enlaces de Interés</h3>
                    <ul class="link-list">
                        <li><a href="https://github.com" target="_blank">Repo de GitHub</a></li>
                        <li><a href="https://console.firebase.google.com/" target="_blank">Consola Firebase</a></li>
                    </ul>
                </section>

                <section class="card" id="registro-section">
                    <h3>📝 Registro de Usuarios</h3>
                    <div id="admin-only-form" style="display:none;">
                        <input type="email" id="reg-email" placeholder="Correo nuevo">
                        <input type="password" id="reg-pass" placeholder="Contraseña nueva">
                        <button onclick="registerUser()" class="btn-admin">Crear Usuario</button>
                    </div>
                    <p id="no-admin-msg">Acceso restringido: Solo lectura.</p>
                </section>

                <section class="card">
                    <h3>📧 Contacto</h3>
                    <p>Soporte: <strong>admin@tuempresa.com</strong></p>
                </section>
            </div>

            <div class="column">
                <section class="card chat-section">
                    <h3>💬 Chat en Vivo</h3>
                    <div id="chat-box" class="chat-display"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Mensaje...">
                        <button onclick="sendMessage()">Enviar</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
