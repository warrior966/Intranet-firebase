<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top right, #f8fafc, #e2e8f0); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-top-color: #2563eb; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="glass w-full max-w-md p-8 rounded-[2.5rem] shadow-2xl border border-white space-y-8">
        <div class="text-center">
            <h1 class="text-4xl font-black text-blue-600 italic tracking-tighter uppercase mb-2">Intranet 2.0</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">Acceso Restringido</p>
        </div>

        <div class="space-y-4">
            <div class="space-y-1">
                <label class="text-[9px] font-black uppercase text-slate-500 ml-4 tracking-widest">Email Corporativo</label>
                <input type="email" id="email" class="w-full px-6 py-4 rounded-2xl bg-white border-none outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-bold text-sm" placeholder="usuario@empresa.com">
            </div>
            <div class="space-y-1">
                <label class="text-[9px] font-black uppercase text-slate-500 ml-4 tracking-widest">Contraseña</label>
                <input type="password" id="password" class="w-full px-6 py-4 rounded-2xl bg-white border-none outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-bold text-sm" placeholder="••••••••">
            </div>
            
            <button id="btnLogin" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-blue-600 transition-all transform active:scale-95 shadow-lg flex justify-center items-center gap-3">
                <span id="btnText">Entrar al Sistema</span>
                <div id="btnLoader" class="spinner hidden"></div>
            </button>
        </div>

        <footer class="text-center">
            <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">© 2024 Sistema de Gestión Interna</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJd8syrMPQunEfBTH0sf9Khj_mSTkWeto",
            authDomain: "intranet-ba388.firebaseapp.com",
            projectId: "intranet-ba388",
            storageBucket: "intranet-ba388.firebasestorage.app",
            messagingSenderId: "104208696906",
            appId: "1:104208696906:web:1dc5ddf05d28d3eb89c8b3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const showToast = (msg, type = "error") => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `mb-2 px-6 py-3 rounded-xl shadow-lg text-white font-bold text-[10px] uppercase tracking-widest transition-all ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        // Redirección si ya hay sesión activa
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "dashboard.html";
        });

        document.getElementById('btnLogin').onclick = async () => {
            const email = document.getElementById('email').value.toLowerCase().trim();
            const pass = document.getElementById('password').value;
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            if (!email || !pass) {
                showToast("Completa todos los campos");
                return;
            }

            // UI Loading
            btnText.innerText = "Verificando...";
            btnLoader.classList.remove('hidden');

            try {
                // 1. Primero verificamos si el email está en la colección de autorizados
                const userDoc = await getDoc(doc(db, "usuarios_autorizados", email));
                
                if (!userDoc.exists()) {
                    showToast("No tienes permiso de acceso");
                    resetBtn();
                    return;
                }

                // 2. Si está autorizado, intentamos el login en Firebase Auth
                await signInWithEmailAndPassword(auth, email, pass);
                
                // 3. Si el login es exitoso, marcamos presencia online
                await setDoc(doc(db, "presencia", email), {
                    online: true,
                    lastChanged: serverTimestamp()
                }, { merge: true });

                // Redirección manual por si onAuthStateChanged tarda
                window.location.href = "dashboard.html";

            } catch (error) {
                console.error("Error completo:", error);
                resetBtn();
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showToast("Credenciales incorrectas");
                } else if (error.code === 'auth/network-request-failed') {
                    showToast("Error de conexión: Revisa tu internet");
                } else {
                    showToast("Error al acceder. Inténtalo de nuevo.");
                }
            }
        };

        function resetBtn() {
            document.getElementById('btnText').innerText = "Entrar al Sistema";
            document.getElementById('btnLoader').classList.add('hidden');
        }
    </script>
</body>
</html>
